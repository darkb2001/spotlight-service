# Application
spring.application.name=spotlight-service
server.port=8080

# Local default: H2 (replace with Oracle in qa/prod)
spring.datasource.url=jdbc:h2:mem:spotlight;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Logging
logging.level.com.example.spotlight=INFO
logging.level.org.springframework.web=INFO
